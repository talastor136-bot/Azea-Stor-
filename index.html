<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azea Stor</title>
    <style>
        :root { --bg: #0E2F2E; --card: #1a4a49; --accent: #2EF2E2; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; text-align: center; margin: 0; }
        h1 { color: var(--accent); margin-bottom: 20px; }
        .admin-box, #buyBox { display: none; background-color: var(--card); padding: 20px; border-radius: 15px; margin: 10px auto; width: 90%; max-width: 400px; }
        input, textarea, select { width: 90%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; }
        button { background-color: var(--accent); color: var(--bg); padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .card { background-color: var(--card); margin: 10px; padding: 15px; border-radius: 15px; display: inline-block; width: 200px; text-align: center; }
        .product-img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        .buy-btn { background-color: var(--accent); color: var(--bg); width: 100%; padding: 10px; border-radius: 5px; border: none; font-weight: bold; margin-top: 5px; }
        .del-btn { background-color: #ff4757; color: white; width: 100%; padding: 8px; border-radius: 5px; border: none; margin-top: 5px; cursor: pointer; }
        .admin-trigger { position: fixed; top: 0; right: 0; width: 50px; height: 50px; cursor: pointer; z-index: 999; }
    </style>
</head>
<body>

    <div class="admin-trigger" onclick="openAdmin()"></div>
    
    <h1>Azea Stor ✨</h1>

    <div id="buyBox">
        <h3>بيانات الطلب</h3>
        <select id="deliveryMethod">
            <option value="إلى باب الدار">التوصيل إلى باب الدار</option>
            <option value="إلى المكتب">الاستلام من المكتب</option>
        </select>
        <input type="text" id="userCity" placeholder="الولاية/المنطقة...">
        <button onclick="confirmPurchase()">تأكيد الطلب عبر إنستغرام</button>
    </div>

    <div class="admin-box" id="adminPanel">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر (DA)">
        <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
        <input type="text" id="pImgUrl" placeholder="رابط الصورة المباشر (.jpg/.png)">
        <button onclick="saveProduct()">نشر المنتج</button>
    </div>

    <div id="displayArea"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxzDMDBD0dFTIuLKddHqCpb4MC_UNVOFU",
            authDomain: "azea-stor.firebaseapp.com",
            projectId: "azea-stor",
            storageBucket: "azea-stor.firebasestorage.app",
            messagingSenderId: "681412025370",
            appId: "1:681412025370:web:99dc9ff26d9167e9c005a3",
            measurementId: "G-73LNSBJ81P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let selectedProduct = null;
        let isAdmin = false;

        window.openAdmin = () => {
            let pass = prompt("أدخل كلمة المرور:");
            if(pass === "201213€£¥₩□●abc") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderProducts(); // إعادة العرض لإظهار أزرار الحذف
            } else { alert("كلمة المرور خاطئة!"); }
        }

        window.saveProduct = async () => {
            await addDoc(collection(db, "items"), { 
                name: document.getElementById("pName").value, 
                price: document.getElementById("pPrice").value, 
                desc: document.getElementById("pDesc").value,
                image: document.getElementById("pImgUrl").value, 
                time: Date.now() 
            });
            alert("تم النشر!"); location.reload();
        }

        window.deleteProduct = async (id) => {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "items", id));
            }
        }

        window.initiateBuy = (name, price, desc) => {
            selectedProduct = {name, price, desc};
            document.getElementById('buyBox').style.display = 'block';
        }

        window.confirmPurchase = () => {
            let delivery = document.getElementById("deliveryMethod").value;
            let city = document.getElementById("userCity").value;
            let msg = `طلب منتج من Azea Stor:%0Aالمنتج: ${selectedProduct.name}%0Aالسعر: ${selectedProduct.price} DA%0Aالوصف: ${selectedProduct.desc}%0Aالمنطقة: ${city}%0Aالتوصيل: ${delivery}`;
            window.open(`https://ig.me/m/azea_stor?text=${msg}`, '_blank');
        }

        function renderProducts() {
            onSnapshot(query(collection(db, "items"), orderBy("time", "desc")), (snap) => {
                let area = document.getElementById("displayArea");
                area.innerHTML = "";
                snap.forEach(docSnap => {
                    let d = docSnap.data();
                    area.innerHTML += `
                        <div class="card">
                            ${d.image ? `<img src="${d.image}" class="product-img">` : ""}
                            <h3>${d.name}</h3>
                            <p>${d.desc}</p>
                            <p><b>${d.price} DA</b></p>
                            <button class="buy-btn" onclick="initiateBuy('${d.name}', '${d.price}', '${d.desc}')">شراء الآن</button>
                            ${isAdmin ? `<button class="del-btn" onclick="deleteProduct('${docSnap.id}')">حذف المنتج 🗑️</button>` : ""}
                        </div>`;
                });
            });
        }
        renderProducts();
    </script>
</body>
</html>

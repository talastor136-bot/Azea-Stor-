<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Azea Stor</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            text-align: center; 
        }
        
        /* تنسيق البطاقة (كبير وواضح) */
        .card { 
            background: #1e293b; 
            margin: 25px auto; 
            padding: 30px; 
            border-radius: 20px; 
            display: block; 
            width: 95%; 
            max-width: 500px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            animation: slideUp 0.8s;
        }

        /* تكبير الخطوط لتكون واضحة */
        .card h3 { font-size: 28px; margin-bottom: 15px; color: #fff; }
        .card p { font-size: 20px; margin: 10px 0; color: #e2e8f0; }
        
        /* زر الشراء ضخم وواضح */
        .buy-btn { 
            background: #e11d48; 
            display: block; 
            margin-top: 20px; 
            padding: 18px; 
            border-radius: 12px; 
            color: white; 
            font-size: 22px;
            font-weight: bold; 
            width: 100%; 
            border: none; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .buy-btn:hover { background: #be123c; }

        /* زر الحذف مخفي افتراضياً */
        .del-btn { 
            display: none; 
            background: #475569; 
            margin-top: 15px; 
            cursor: pointer; 
            border: none; 
            color: #cbd5e1; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-size: 16px; 
        }

        .admin-box { display: none; background: #1e293b; padding: 20px; border-radius: 15px; margin: 20px auto; width: 90%; max-width: 500px; }
        input, textarea { width: 90%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #22c55e; padding: 15px 30px; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 18px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="admin-trigger" onclick="openAdmin()" style="position:fixed; top:0; right:0; width:50px; height:50px; cursor:pointer;"></div>
    
    <div class="welcome" style="margin-top:30px;">
        <h1>مرحباً بكم في Azea Stor ✨</h1>
    </div>

    <div class="admin-box" id="adminPanel">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
        <button onclick="saveProduct()">نشر المنتج</button>
    </div>

    <div id="displayArea"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxzDMDBD0dFTIuLKddHqCpb4MC_UNVOFU",
            authDomain: "azea-stor.firebaseapp.com",
            projectId: "azea-stor",
            storageBucket: "azea-stor.firebasestorage.app",
            messagingSenderId: "681412025370",
            appId: "1:681412025370:web:99dc9ff26d9167e9c005a3",
            measurementId: "G-73LNSBJ81P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let isAdmin = false;

        window.openAdmin = () => {
            let pass = prompt("أدخل كلمة المرور:");
            if(pass === "201213€£¥₩□●abc") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                document.querySelectorAll('.del-btn').forEach(btn => btn.style.display = 'inline-block');
            }
        }

        window.saveProduct = async () => {
            let name = document.getElementById("pName").value;
            let price = document.getElementById("pPrice").value;
            let desc = document.getElementById("pDesc").value;
            await addDoc(collection(db, "items"), { name, price, desc, sales: 0, time: Date.now() });
            alert("تم النشر!");
            location.reload();
        }

        window.buyProduct = async (id) => {
            await updateDoc(doc(db, "items", id), { sales: increment(1) });
            window.open("https://www.instagram.com/alaalqkjqj", "_blank");
        }

        window.deleteProduct = async (id) => {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "items", id));
            }
        }

        onSnapshot(query(collection(db, "items"), orderBy("time", "desc")), (snap) => {
            let area = document.getElementById("displayArea");
            area.innerHTML = "";
            snap.forEach(doc => {
                let d = doc.data();
                let descHtml = d.desc ? `<p>${d.desc}</p>` : "";
                
                area.innerHTML += `
                    <div class="card">
                        <h3>${d.name}</h3>
                        ${descHtml}
                        <p><b>${d.price} DA</b></p>
                        <p style="font-size:16px; color:#94a3b8;">المبيعات: ${d.sales || 0}</p>
                        <button onclick="buyProduct('${doc.id}')" class="buy-btn">شراء الآن</button>
                        <button class="del-btn" style="display: ${isAdmin ? 'inline-block' : 'none'}" onclick="deleteProduct('${doc.id}')">حذف</button>
                    </div>`;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Azea Stor</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: sans-serif; 
            padding: 30px; 
            text-align: center; 
            /* منع أي حركات جانبية للشاشة */
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        .card { 
            background: #1e293b; 
            margin: 40px auto; 
            padding: 40px; 
            border-radius: 30px; 
            display: block; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
        }

        .card h3 { font-size: 36px; margin-bottom: 20px; color: #fff; }
        .card p { font-size: 26px; margin: 15px 0; color: #e2e8f0; }
        
        .buy-btn { 
            background: #e11d48; 
            display: block; 
            margin-top: 30px; 
            padding: 25px; 
            border-radius: 20px; 
            color: white; 
            font-size: 28px;
            font-weight: bold; 
            width: 100%; 
            border: none; 
            cursor: pointer; 
        }

        .admin-box { display: none; background: #1e293b; padding: 30px; border-radius: 20px; margin: 30px auto; width: 90%; max-width: 600px; }
        input, textarea { width: 95%; padding: 20px; margin: 15px 0; border-radius: 15px; border: none; font-size: 20px; }
        button { background: #22c55e; padding: 20px 40px; border: none; border-radius: 15px; color: white; cursor: pointer; font-size: 22px; }
    </style>
</head>
<body>

    <div class="admin-trigger" onclick="openAdmin()" style="position:fixed; top:0; right:0; width:80px; height:80px; cursor:pointer;"></div>
    
    <div style="margin-top:50px; margin-bottom: 50px;">
        <h1 style="font-size: 40px;">مرحباً بكم في Azea Stor ✨</h1>
    </div>

    <div class="admin-box" id="adminPanel">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
        <button onclick="saveProduct()">نشر المنتج</button>
    </div>

    <div id="displayArea"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxzDMDBD0dFTIuLKddHqCpb4MC_UNVOFU",
            authDomain: "azea-stor.firebaseapp.com",
            projectId: "azea-stor",
            storageBucket: "azea-stor.firebasestorage.app",
            messagingSenderId: "681412025370",
            appId: "1:681412025370:web:99dc9ff26d9167e9c005a3",
            measurementId: "G-73LNSBJ81P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.openAdmin = () => {
            let pass = prompt("أدخل كلمة المرور:");
            if(pass === "201213€£¥₩□●abc") {
                document.getElementById('adminPanel').style.display = 'block';
            }
        }

        window.saveProduct = async () => {
            let name = document.getElementById("pName").value;
            let price = document.getElementById("pPrice").value;
            let desc = document.getElementById("pDesc").value;
            await addDoc(collection(db, "items"), { name, price, desc, sales: 0, time: Date.now() });
            location.reload();
        }

        window.buyProduct = async (id) => {
            await updateDoc(doc(db, "items", id), { sales: increment(1) });
            window.open("https://www.instagram.com/alaalqkjqj", "_blank");
        }

        onSnapshot(query(collection(db, "items"), orderBy("time", "desc")), (snap) => {
            let area = document.getElementById("displayArea");
            area.innerHTML = "";
            snap.forEach(doc => {
                let d = doc.data();
                area.innerHTML += `
                    <div class="card">
                        <h3>${d.name}</h3>
                        ${d.desc ? `<p>${d.desc}</p>` : ""}
                        <p><b>${d.price} DA</b></p>
                        <p style="font-size:20px; color:#94a3b8;">المبيعات: ${d.sales || 0}</p>
                        <button onclick="buyProduct('${doc.id}')" class="buy-btn">شراء الآن</button>
                    </div>`;
            });
        });
    </script>
</body>
</html>

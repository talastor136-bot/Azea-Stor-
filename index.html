<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azea Stor ✨</title>
    <style>
        :root { --bg: #0E2F2E; --card: #1a4a49; --accent: #2EF2E2; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; text-align: center; margin: 0; }
        
        .welcome { margin-bottom: 30px; padding: 20px; border-bottom: 1px solid var(--card); }
        .welcome h1 { color: var(--accent); margin-bottom: 10px; text-shadow: 0 0 10px rgba(46, 242, 226, 0.2); }
        .welcome p { color: #cbd5e1; font-size: 1.1rem; }

        .card { 
            background-color: var(--card); margin: 15px; padding: 15px; border-radius: 20px; 
            display: inline-block; width: 220px; transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05); text-align: center;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        
        .admin-box, #buyBox { display: none; background-color: var(--card); padding: 20px; border-radius: 15px; margin: 20px auto; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; }
        input, textarea, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; }
        button { background-color: var(--accent); color: var(--bg); padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        
        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        .buy-btn { background-color: var(--accent); color: var(--bg); width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .del-btn { background-color: #ff4757; color: white; width: 100%; padding: 8px; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        .admin-trigger { position: fixed; top: 0; right: 0; width: 60px; height: 60px; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

    <div class="admin-trigger" onclick="toggleAdmin()"></div>
    
    <div class="welcome">
        <h1>مرحباً بكم في Azea Stor ✨</h1>
        <p>اكتشفوا أفضل المنتجات بأسعار مميزة. كل ما تحبونه في مكان واحد!</p>
    </div>

    <div id="buyBox">
        <h3>بيانات الطلب</h3>
        <select id="deliveryMethod">
            <option value="إلى باب الدار">التوصيل إلى باب الدار</option>
            <option value="إلى المكتب">الاستلام من المكتب</option>
        </select>
        <input type="text" id="userCity" placeholder="الولاية/المنطقة...">
        <button onclick="confirmPurchase()">تأكيد الطلب</button>
        <button style="background:none; color:white; margin-top:10px;" onclick="document.getElementById('buyBox').style.display='none'">إلغاء</button>
    </div>

    <div id="adminPanel" class="admin-box">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر (DA)">
        <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
        <input type="text" id="pImgUrl" placeholder="رابط الصورة المباشر (.jpg/.png)">
        <button onclick="saveProduct()">نشر المنتج</button>
    </div>

    <div id="displayArea"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxzDMDBD0dFTIuLKddHqCpb4MC_UNVOFU",
            authDomain: "azea-stor.firebaseapp.com",
            projectId: "azea-stor",
            storageBucket: "azea-stor.firebasestorage.app",
            messagingSenderId: "681412025370",
            appId: "1:681412025370:web:99dc9ff26d9167e9c005a3",
            measurementId: "G-73LNSBJ81P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let selectedProduct = null;

        window.toggleAdmin = () => {
            if (localStorage.getItem('isAdmin') === 'true') {
                if (confirm("تسجيل الخروج من الإدارة؟")) {
                    localStorage.setItem('isAdmin', 'false');
                    location.reload();
                }
            } else {
                let pass = prompt("كلمة المرور:");
                if (pass === "201213€£¥₩□●abc") {
                    localStorage.setItem('isAdmin', 'true');
                    location.reload();
                } else { alert("كلمة المرور خاطئة!"); }
            }
        }

        window.saveProduct = async () => {
            await addDoc(collection(db, "items"), { 
                name: document.getElementById("pName").value, 
                price: document.getElementById("pPrice").value, 
                desc: document.getElementById("pDesc").value,
                image: document.getElementById("pImgUrl").value, 
                time: Date.now() 
            });
            alert("تم النشر!"); location.reload();
        }

        window.deleteProduct = async (id) => {
            if (confirm("هل تريد حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "items", id));
            }
        }

        window.initiateBuy = (name, price, desc) => {
            selectedProduct = {name, price, desc};
            document.getElementById('buyBox').style.display = 'block';
        }

        window.confirmPurchase = () => {
            let delivery = document.getElementById("deliveryMethod").value;
            let city = document.getElementById("userCity").value;

            let rawMsg = `السلام عليكم، أريد طلب منتج من Azea Stor:
----------------------------
📦 المنتج: ${selectedProduct.name}
💰 السعر: ${selectedProduct.price} DA
📝 الوصف: ${selectedProduct.desc}
----------------------------
📍 المنطقة: ${city}
🚚 التوصيل: ${delivery}`;

            navigator.clipboard.writeText(rawMsg)
            .then(() => {
                alert(`تم نسخ رسالة الطلب تلقائياً ✅
سيتم فتح إنستغرام الآن.
ادخل إلى الخاص ثم اضغط لصق لإرسال الطلب.`);
                window.open('https://ig.me/m/azea_stor', '_blank');
            })
            .catch(() => {
                alert(`تعذر نسخ الرسالة تلقائياً. سيتم فتح إنستغرام الآن.`);
                window.open('https://ig.me/m/azea_stor', '_blank');
            });

            document.getElementById('buyBox').style.display = 'none';
        }

        onSnapshot(query(collection(db, "items"), orderBy("time", "desc")), (snap) => {
            let area = document.getElementById("displayArea");
            area.innerHTML = "";
            let isAdmin = localStorage.getItem('isAdmin') === 'true';
            
            if(isAdmin) document.getElementById('adminPanel').style.display = 'block';

            snap.forEach(docSnap => {
                let d = docSnap.data();
                area.innerHTML += `
                    <div class="card">
                        ${d.image ? `<img src="${d.image}" class="product-img">` : ""}
                        <h3>${d.name}</h3>
                        <p style="font-size: 0.9rem; color: #cbd5e1;">${d.desc}</p>
                        <p><b>${d.price} DA</b></p>
                        <button class="buy-btn" onclick="initiateBuy('${d.name}', '${d.price}', '${d.desc}')">شراء الآن</button>
                        ${isAdmin ? `<button class="del-btn" onclick="deleteProduct('${docSnap.id}')">حذف 🗑️</button>` : ""}
                    </div>`;
            });
        });
    </script>
</body>
</html>
